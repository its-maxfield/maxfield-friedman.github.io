name: Refresh fantasy war room

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run refresh-fantasy
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      - run: npm run build
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/fantasy-refresh
          delete-branch: true
          commit-message: "data: refresh fantasy draft signals"
          title: "Fantasy war room data refresh"
          body: |
            Automated projections, ADP snapshot, roster/news evidence, and proposed ranking impacts.

            Merging this pull request approves the cited adjustments and publishes them through the normal Pages deployment. Closing it rejects the batch.
          labels: fantasy-data
