<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Maxfield Friedman — Game Dev Portfolio</title>
  <meta name="description" content="Portfolio — Game Developer" />
  <link rel="icon" href="assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg:           #16171a;
      --sidebar-bg:   #1c1e21;
      --surface:      #222428;
      --surface-2:    #2a2d32;
      --border:       #2e3138;
      --border-accent:#5a6650;
      --text-primary: #e8ece8;
      --text-muted:   #8a9188;
      --text-dim:     #505850;
      --accent:       #7e9464;
      --accent-dim:   #3d4e38;
      --accent-text:  #b5c9a4;
      --radius:       8px;
      --radius-lg:    12px;
      --sidebar-w:    220px;
      --font-body:    'Inter', system-ui, sans-serif;
      --font-mono:    'JetBrains Mono', ui-monospace, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    a { color: inherit; text-decoration: none; }

    body {
      background: var(--bg);
      color: var(--text-primary);
      font-family: var(--font-body);
      display: flex;
      min-height: 100vh;
    }

    /* ============================================================
       SIDEBAR (desktop)
    ============================================================ */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      position: fixed;
      top: 0; left: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
      z-index: 100;
    }

    .sidebar-profile {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .sidebar-avatar {
      width: 80px;
      height: 80px;
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 12px;
      border: 1px solid var(--border-accent);
    }

    .sidebar-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .sidebar-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.3;
    }

    .sidebar-tag {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: var(--radius);
      font-size: 14px;
      color: var(--text-muted);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      font-family: var(--font-body);
    }

    .nav-item:hover {
      background: var(--surface);
      color: var(--text-primary);
    }

    .nav-item.active {
      background: var(--accent-dim);
      color: var(--accent-text);
    }

    .nav-icon {
      font-size: 15px;
      width: 18px;
      text-align: center;
    }

    .sidebar-footer {
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    /* ============================================================
       TOPBAR (mobile only)
    ============================================================ */
    .topbar {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 56px;
      background: var(--sidebar-bg);
      border-bottom: 1px solid var(--border);
      z-index: 100;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
    }

    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .topbar-avatar {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .topbar-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .topbar-name {
      font-size: 14px;
      font-weight: 700;
    }

    .topbar-nav {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      flex: 1;
    }

    .topbar-nav .nav-item {
      flex-shrink: 0;
      padding: 6px 10px;
      font-size: 13px;
      width: auto;
    }

    /* ============================================================
       MAIN CONTENT
    ============================================================ */
    .main-content {
      margin-left: var(--sidebar-w);
      flex: 1;
      min-height: 100vh;
    }

    /* ============================================================
       PAGES
    ============================================================ */
    .page {
      display: none;
      padding: 32px;
      min-height: 100vh;
    }

    .page.active {
      display: block;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .page-title {
      font-size: 22px;
      font-weight: 700;
    }

    /* ============================================================
       CARDS + SURFACES
    ============================================================ */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
    }

    /* ============================================================
       BUTTONS
    ============================================================ */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent);
      color: #1a2016;
      padding: 9px 16px;
      border-radius: var(--radius);
      font-weight: 600;
      font-size: 14px;
      border: none;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn:hover { background: var(--accent-text); }

    .btn-ghost {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      color: var(--text-muted);
      padding: 9px 16px;
      border-radius: var(--radius);
      font-size: 14px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      font-family: var(--font-body);
    }

    .btn-ghost:hover {
      background: var(--surface-2);
      color: var(--text-primary);
    }

    .btn-full { width: 100%; justify-content: center; }

    /* ============================================================
       ABOUT PAGE
    ============================================================ */
    .about-grid {
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 24px;
      align-items: start;
    }

    .bio-text {
      line-height: 1.7;
      color: var(--text-muted);
      font-size: 15px;
    }

    .cta-row {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .stat-row {
      display: flex;
      flex-direction: column;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .stat-row:last-child { border-bottom: none; }

    .stat-label {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .stat-value {
      font-weight: 700;
      font-size: 15px;
      margin-top: 2px;
    }

    .skills-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
    }

    .skill-chip {
      font-family: var(--font-mono);
      font-size: 12px;
      background: var(--accent-dim);
      color: var(--accent-text);
      padding: 4px 10px;
      border-radius: var(--radius);
      border: 1px solid var(--border-accent);
    }

    .section-label {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 10px;
    }

    /* ============================================================
       PROJECTS PAGE
    ============================================================ */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .project {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      display: flex;
      flex-direction: column;
    }

    .project:hover {
      border-color: var(--border-accent);
      background: var(--surface-2);
    }

    .project-media {
      background: #0d0f12;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 140px;
    }

    .project-media img {
      width: 100%;
      height: auto;
      object-fit: contain;
      display: block;
    }

    .project-body { padding: 14px; }

    .project-title {
      font-weight: 700;
      font-size: 15px;
    }

    .project-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .tags {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .tag {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      background: var(--surface-2);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .filter-select {
      font-family: var(--font-mono);
      font-size: 13px;
      padding: 7px 10px;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-primary);
      cursor: pointer;
    }

    /* ============================================================
       MODAL
    ============================================================ */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 9999;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border-accent);
      border-radius: var(--radius-lg);
      padding: 20px;
      max-width: 900px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      z-index: 10000;
      position: relative;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 14px;
      gap: 12px;
    }

    .modal-media {
      height: 320px;
      background: #0d0f12;
      border-radius: var(--radius);
      overflow: hidden;
      position: relative;
    }

    .modal-media iframe,
    .modal-media video {
      width: 100% !important;
      height: 100% !important;
      border: 0 !important;
    }

    .modal-media img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      margin: auto;
    }

    .carousel-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.55);
      color: #fff;
      border: none;
      font-size: 22px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .carousel-arrow:hover {
      background: rgba(0,0,0,0.8);
    }

    .carousel-arrow.prev { left: 8px; }
    .carousel-arrow.next { right: 8px; }

    .carousel-counter {
      text-align: center;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 8px;
    }

    /* ============================================================
       EXPERIENCE PAGE
    ============================================================ */
    .exp-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .exp-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
    }

    .exp-header {
      display: grid;
      grid-template-columns: 56px 1fr;
      gap: 14px;
      align-items: center;
      margin-bottom: 16px;
    }

    .exp-logo {
      width: 56px;
      height: 56px;
      border-radius: var(--radius);
      object-fit: contain;
      background: var(--surface-2);
      border: 1px solid var(--border);
    }

    .exp-company {
      font-weight: 700;
      font-size: 16px;
    }

    .exp-roles {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .exp-role {
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .role-title {
      font-weight: 600;
      font-size: 14px;
    }

    .role-date {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--accent-text);
      margin-top: 2px;
    }

    .role-desc {
      color: var(--text-muted);
      font-size: 14px;
      margin-top: 6px;
      line-height: 1.6;
    }

    /* ============================================================
       HOBBIES PAGE
    ============================================================ */
    .hobby-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .hobby-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
    }

    .hobby-name {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .hobby-desc {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .accomplishments-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }

    .accomplishment {
      padding: 10px 14px;
      border-left: 2px solid var(--accent);
      background: var(--surface-2);
      border-radius: 0 var(--radius) var(--radius) 0;
    }

    .accomplishment-title {
      font-weight: 600;
      font-size: 14px;
    }

    .accomplishment img {
      width: 100%;
      border-radius: var(--radius);
      margin-top: 8px;
      object-fit: cover;
    }

    /* ============================================================
       CONTACT PAGE
    ============================================================ */
    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .contact-email-display {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 12px;
    }

    .social-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .social-row:last-child { border-bottom: none; }

    .social-label {
      font-weight: 600;
      font-size: 14px;
    }

    /* ============================================================
       MOBILE
    ============================================================ */
    @media(max-width:768px) {
      .sidebar { display: none; }
      .topbar { display: flex; }
      .main-content {
        margin-left: 0;
        margin-top: 56px;
      }
      .page { padding: 20px 16px; }
      .about-grid { grid-template-columns: 1fr; }
      .contact-grid { grid-template-columns: 1fr; }
      .projects-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

/* ============================================================

============================================================ */
const PAGES = ['about','projects','experience','hobbies','contact'];

function showPage(pageId) {
  PAGES.forEach(id => document.getElementById('page-'+id).classList.remove('active'));
  document.getElementById('page-'+pageId).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(el =>
    el.classList.toggle('active', el.dataset.page === pageId));
  history.replaceState(null, '', '#' + pageId);
}

document.querySelectorAll('.nav-item').forEach(el =>
  el.addEventListener('click', e => { e.preventDefault(); showPage(el.dataset.page); }));

============================================================ */
function setupEmailCopy(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('click', function(e) {
    e.preventDefault();
    const email = SITE_CONFIG.email;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(email)
        .then(() => { alert(`Email copied to clipboard: ${email}`); })
        .catch(() => { window.location.href = `mailto:${email}`; });
    } else {
      window.location.href = `mailto:${email}`;
    }
  });
}

/* ============================================================
   MODAL
============================================================ */
const modalBackdrop = document.getElementById('modalBackdrop');
const modalTitle    = document.getElementById('modalTitle');
const modalSubtitle = document.getElementById('modalSubtitle');
const modalDesc     = document.getElementById('modalDesc');
const modalMedia    = document.getElementById('modalMedia');

function openModal(card) {
  const p = SITE_CONFIG.projects[card.dataset.index];
  modalTitle.textContent = p.title;
  modalSubtitle.textContent = p.subtitle;
  modalDesc.innerHTML = p.desc;

  modalMedia.innerHTML = '';
  const mediaItems = p.media || [];
  let currentIndex = 0;

  function renderMediaItem(index) {
    // Clear previous content
    modalMedia.innerHTML = '';
    if (mediaItems.length === 0) {
      modalMedia.textContent = 'No media provided';
      return;
    }

    const item = mediaItems[index];
    const contentWrap = document.createElement('div');
    contentWrap.style.cssText = 'width:100%;height:100%;display:flex;align-items:center;justify-content:center';

    if (item.type === 'youtube') {
      const src = item.src;
      const id = src.includes('youtu.be')
        ? src.split('/').pop()
        : (new URL(src)).searchParams.get('v');
      const iframe = document.createElement('iframe');
      iframe.src = `https://www.youtube.com/embed/${id}`;
      iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
      iframe.allowFullscreen = true;
      contentWrap.appendChild(iframe);
    } else if (item.type === 'vimeo') {
      const id = item.src.split('/').pop();
      const iframe = document.createElement('iframe');
      iframe.src = `https://player.vimeo.com/video/${id}`;
      iframe.allowFullscreen = true;
      contentWrap.appendChild(iframe);
    } else if (item.type === 'video') {
      const video = document.createElement('video');
      video.src = item.src;
      video.controls = true;
      contentWrap.appendChild(video);
    } else if (item.type === 'image') {
      const img = document.createElement('img');
      img.src = item.src;
      img.alt = p.title;
      contentWrap.appendChild(img);
    }

    modalMedia.appendChild(contentWrap);

    // Arrows (only if multiple items)
    if (mediaItems.length > 1) {
      if (index > 0) {
        const prev = document.createElement('button');
        prev.className = 'carousel-arrow prev';
        prev.innerHTML = '&#8249;';
        prev.onclick = (e) => { e.stopPropagation(); currentIndex--; renderMediaItem(currentIndex); };
        modalMedia.appendChild(prev);
      }
      if (index < mediaItems.length - 1) {
        const next = document.createElement('button');
        next.className = 'carousel-arrow next';
        next.innerHTML = '&#8250;';
        next.onclick = (e) => { e.stopPropagation(); currentIndex++; renderMediaItem(currentIndex); };
        modalMedia.appendChild(next);
      }

      const counter = document.createElement('div');
      counter.className = 'carousel-counter';
      counter.textContent = `${index + 1} / ${mediaItems.length}`;
      modalMedia.appendChild(counter);
    }
  }

  renderMediaItem(0);
  modalBackdrop.style.display = 'flex';
}

document.getElementById('closeModal').onclick = () => modalBackdrop.style.display = 'none';
modalBackdrop.onclick = e => { if (e.target === modalBackdrop) modalBackdrop.style.display = 'none'; };
